      EndLayerNo: 3
      Specs: "_5cm"
    - RowNo: 2
      StartColNo: 2
      EndColNo: 13
      StartLayerNo: 1
      EndLayerNo: 3
      Specs: "_5cm"
    - RowNo: 2
      StartColNo: 15
      EndColNo: 26
      StartLayerNo: 1
      EndLayerNo: 3
      Specs: "_5cm"
    - RowNo: 3
      StartColNo: 2
      EndColNo: 13
      StartLayerNo: 1
      EndLayerNo: 3
      Specs: "_5cm"
    - RowNo: 3
      StartColNo: 15
      EndColNo: 26
      StartLayerNo: 1
      EndLayerNo: 3
      Specs: "_5cm"
    - RowNo: 4
      StartColNo: 2
      EndColNo: 18
      StartLayerNo: 1
      EndLayerNo: 3
      Specs: "_3cm"
    - RowNo: 4
      StartColNo: 20
      EndColNo: 36
      StartLayerNo: 1
